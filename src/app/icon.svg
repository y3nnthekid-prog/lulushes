<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Lulus HES">
  <!--
    Hati merah muda, ikon tab Lulus HES.

    Dibuat sebagai SVG supaya tetap tajam di layar kepadatan tinggi tanpa
    menyimpan beberapa ukuran raster. Warnanya diambil dari palet website:
    #ff4fa3 (token pop) ke #c11563 (turunan token brand).

    Catatan penulisan: komentar XML tidak boleh memuat tanda hubung ganda,
    jadi nama token CSS di sini ditulis tanpa awalan garisnya. Versi pertama
    menulisnya lengkap dan seluruh berkasnya ditolak sebagai XML tak valid.

    Gradasinya sengaja tipis dan hanya di sumbu tegak. Di ukuran tab 16 piksel
    gradasi yang rumit berubah jadi bubur; yang ini cuma memberi sedikit
    kedalaman supaya bentuknya tidak terbaca rata seperti stiker.

    Tanpa latar: ikon tab tampil di atas bilah yang bisa terang atau gelap, dan
    merah muda jenuh ini cukup kontras terhadap keduanya.
  -->
  <defs>
    <linearGradient id="p" x1="16" y1="4" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fa3" />
      <stop offset="1" stop-color="#c11563" />
    </linearGradient>
  </defs>
  <path
    fill="url(#p)"
    d="M16 28.6c-.5 0-.9-.2-1.2-.5C10.1 24 3 18.3 3 11.9 3 7.4 6.5 3.9 10.9 3.9c2.2 0 4.1 1 5.1 2.5 1-1.5 2.9-2.5 5.1-2.5C25.5 3.9 29 7.4 29 11.9c0 6.4-7.1 12.1-11.8 16.2-.3.3-.7.5-1.2.5z"
  />
</svg>
